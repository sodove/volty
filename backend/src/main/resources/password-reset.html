<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Смена пароля · Volty</title>
  <style nonce="__CSP_NONCE__">
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a101b;
      color: #edf3fc;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(48, 105, 184, 0.19), transparent 54%),
        #0a101b;
    }

    .card {
      width: min(100%, 420px);
      padding: 36px 32px 32px;
      border: 1px solid #263449;
      border-radius: 20px;
      background: rgba(17, 26, 40, 0.96);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.34);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 30px;
      color: #b8c7db;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .brand-mark {
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      border: 1px solid #3768a9;
      border-radius: 8px;
      color: #8cbaff;
      font-size: 15px;
      line-height: 1;
    }

    h1 {
      margin: 0;
      color: #f4f7fc;
      font-size: clamp(25px, 7vw, 29px);
      font-weight: 650;
      letter-spacing: -0.035em;
      line-height: 1.2;
    }

    .intro {
      margin: 12px 0 28px;
      color: #a9b7c9;
      font-size: 15px;
      line-height: 1.55;
    }

    .field {
      margin: 0 0 19px;
    }

    fieldset {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
    }

    label.field-label {
      display: block;
      margin-bottom: 8px;
      color: #dce5f1;
      font-size: 13px;
      font-weight: 600;
    }

    input[type="password"],
    input[type="text"] {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid #34445b;
      border-radius: 10px;
      outline: none;
      background: #0d1624;
      color: #f4f7fc;
      font: inherit;
      font-size: 15px;
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }

    input[type="password"]:hover,
    input[type="text"]:hover {
      border-color: #506783;
    }

    input[type="password"]:focus,
    input[type="text"]:focus {
      border-color: #6da8ff;
      box-shadow: 0 0 0 3px rgba(80, 145, 235, 0.2);
    }

    .hint {
      margin: 8px 0 0;
      color: #8595aa;
      font-size: 12px;
      line-height: 1.45;
    }

    .show-password {
      width: fit-content;
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 24px;
      color: #b7c4d5;
      font-size: 13px;
      line-height: 1.4;
      cursor: pointer;
    }

    .show-password input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #5a9cf2;
    }

    button {
      width: 100%;
      min-height: 48px;
      padding: 12px 16px;
      border: 1px solid #4385da;
      border-radius: 10px;
      background: #347bd0;
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 650;
      cursor: pointer;
      transition: background-color 140ms ease, border-color 140ms ease, transform 140ms ease;
    }

    button:hover:not(:disabled) {
      border-color: #69a6f4;
      background: #438ce3;
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
    }

    button:focus-visible,
    .show-password input:focus-visible {
      outline: 3px solid rgba(125, 179, 255, 0.75);
      outline-offset: 3px;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.72;
    }

    .feedback {
      margin: 18px 0 0;
      color: #f4a4a4;
      font-size: 13px;
      line-height: 1.5;
    }

    .feedback:empty {
      display: none;
    }

    .feedback.success {
      color: #9ce0b1;
    }

    @media (max-width: 360px) {
      body {
        padding: 16px 12px;
      }

      .card {
        padding: 25px 20px 22px;
        border-radius: 16px;
      }

      .brand {
        margin-bottom: 25px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="card" aria-labelledby="page-title">
    <div class="brand" aria-label="Volty">
      <span class="brand-mark" aria-hidden="true">V</span>
      <span>Volty</span>
    </div>
    <h1 id="page-title">Новый пароль</h1>
    <p class="intro">Задайте пароль для входа в Volty.</p>

    <form id="reset-form">
      <fieldset id="reset-fields">
        <div class="field">
          <label class="field-label" for="new-password">Новый пароль</label>
          <input
            id="new-password"
            name="newPassword"
            type="password"
            autocomplete="new-password"
            minlength="12"
            maxlength="128"
            required
            aria-describedby="password-hint"
          >
          <p class="hint" id="password-hint">От 12 до 128 символов.</p>
        </div>

        <div class="field">
          <label class="field-label" for="confirm-password">Повторите пароль</label>
          <input
            id="confirm-password"
            name="confirmPassword"
            type="password"
            autocomplete="new-password"
            minlength="12"
            maxlength="128"
            required
          >
        </div>

        <label class="show-password" for="show-password">
          <input id="show-password" type="checkbox" aria-controls="new-password confirm-password">
          <span>Показать пароль</span>
        </label>

        <button id="submit-button" type="submit">Сохранить новый пароль</button>
      </fieldset>
    </form>
    <p id="feedback" class="feedback" role="status" aria-live="polite" tabindex="-1"></p>
  </main>

  <script nonce="__CSP_NONCE__">
    (() => {
      'use strict';

      const token = new URLSearchParams(window.location.hash.slice(1)).get('token');
      window.history.replaceState(window.history.state, '', window.location.pathname + window.location.search);

      const form = document.getElementById('reset-form');
      const fields = document.getElementById('reset-fields');
      const password = document.getElementById('new-password');
      const confirmation = document.getElementById('confirm-password');
      const showPassword = document.getElementById('show-password');
      const submitButton = document.getElementById('submit-button');
      const feedback = document.getElementById('feedback');
      const defaultButtonText = submitButton.textContent;
      let inFlight = false;

      function showMessage(message, kind) {
        feedback.textContent = message;
        feedback.className = kind === 'success' ? 'feedback success' : 'feedback';
        feedback.focus();
      }

      if (!token) {
        fields.disabled = true;
        showMessage('В ссылке нет данных для смены пароля. Откройте ссылку из письма или запросите новую.', 'error');
        return;
      }

      showPassword.addEventListener('change', () => {
        const type = showPassword.checked ? 'text' : 'password';
        password.type = type;
        confirmation.type = type;
      });

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (inFlight || !token) return;

        if (password.value.trim().length === 0) {
          showMessage('Пароль не может состоять только из пробелов.', 'error');
          password.focus();
          return;
        }

        if (password.value !== confirmation.value) {
          showMessage('Пароли не совпадают.', 'error');
          confirmation.focus();
          return;
        }

        inFlight = true;
        fields.disabled = true;
        submitButton.textContent = 'Сохраняем…';
        feedback.textContent = '';

        try {
          const response = await fetch('/v1/auth/password-reset', {
            method: 'POST',
            credentials: 'omit',
            redirect: 'error',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token, newPassword: password.value })
          });

          if (!response.ok) {
            let code = '';
            try { code = (await response.json()).code || ''; } catch {}
            if (response.status === 429) {
              showMessage('Слишком много попыток. Подождите минуту и попробуйте ещё раз.', 'error');
            } else if (response.status >= 500) {
              showMessage('Сервер временно недоступен. Попробуйте ещё раз позже.', 'error');
            } else if (code === 'invalid_token') {
              showMessage('Ссылка недействительна или срок её действия истёк. Запросите новую ссылку для смены пароля.', 'error');
            } else {
              showMessage('Не удалось сохранить пароль. Проверьте, что он содержит от 12 до 128 символов, и попробуйте ещё раз.', 'error');
            }
            return;
          }

          form.hidden = true;
          showMessage('Пароль изменён. Вернитесь в Volty и войдите с новым паролем.', 'success');
        } catch {
          showMessage('Не удалось связаться с сервером. Проверьте подключение и попробуйте ещё раз.', 'error');
        } finally {
          inFlight = false;
          if (!form.hidden) {
            fields.disabled = false;
            submitButton.textContent = defaultButtonText;
          }
        }
      });
    })();
  </script>
</body>
</html>
